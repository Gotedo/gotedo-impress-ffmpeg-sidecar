version: '3'

vars:
  # Detect host OS and ARCH if not explicitly passed
  OS: '{{.OS | default .GOOS | default (env "GOOS") | default OS}}'
  ARCH: '{{.ARCH | default ARCH}}'
  DEFAULT_FFMPEG_SRC_BASE: '{{.FFMPEG_SRC_BASE | default (print .TASKFILE_DIR "/../../libs/ffmpeg") | clean}}'
  IS_TEST: '{{.IS_TEST}}'

tasks:
  apt-cache:
    desc: Ensure the apt-cache-proxy container is running
    internal: true
    run: once
    status:
      # The task is skipped if this command exits with 0 (i.e., container is running)
      - docker ps -q -f name=^apt-cache-proxy$ -f status=running | grep -q .
    cmds:
      # 1. Remove any stopped or dead container with this name to avoid conflicts
      - docker rm -f apt-cache-proxy 2>/dev/null || true

      # 2. Build the image only if it doesn't already exist locally
      - |
        if ! docker image inspect sameersbn/apt-cacher-ng >/dev/null 2>&1; then
          echo ">>> Building sameersbn/apt-cacher-ng image..."
          docker build -t sameersbn/apt-cacher-ng https://github.com/sameersbn/docker-apt-cacher-ng.git
        else
          echo ">>> Docker image sameersbn/apt-cacher-ng already exists. Skipping build."
        fi

      # 3. Start the proxy container
      - echo ">>> Launching apt-cache-proxy container..."
      - |
        docker run -d \
          --name apt-cache-proxy \
          -p 3142:3142 \
          -v /tmp/apt-cacher-ng:/var/cache/apt-cacher-ng \
          sameersbn/apt-cacher-ng

  create-ffmpeg-builder:
    desc: Set up a dedicated buildx container builder instance
    internal: true
    cmds:
      - |
        if ! docker buildx ls | grep -q "ffmpeg-builder"; then
          docker buildx create --use --driver docker-container --name ffmpeg-builder --bootstrap
        fi
      - docker buildx use ffmpeg-builder
      # Build the compiler-toolchain runner image using our local Dockerfile
      - |
        docker buildx build --progress=plain \
          --builder ffmpeg-builder \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from=type=local,src={{.TASKFILE_DIR}}/build_cache/buildx \
          --cache-to=type=local,dest={{.TASKFILE_DIR}}/build_cache/buildx,mode=max \
          --cache-to=type=inline \
          -t ffmpeg-builder \
          -f {{.TASKFILE_DIR}}/Dockerfile \
          --load {{.TASKFILE_DIR}}

  build:ffmpeg:
    desc: Build FFmpeg dynamically using multi-platform cross-compilation
    summary: |
      Compiles FFmpeg and its libraries across Linux, macOS, and Windows.
      Outputs built components directly to the local 'dist/' directory.
    deps:
      - task: apt-cache
      - task: create-ffmpeg-builder
    cmds:
      # Cross-compile across target OS and Architecture arrays
      - |
        {{- $os_list := .GOOS_VAR | default "windows,linux,darwin" | replace "[" "" | replace "]" "" | replace "'" "" | replace " " "" | splitList "," -}}
        {{- $arch_list := .ARCH_VAR | default "amd64,arm64" | replace "[" "" | replace "]" "" | replace "'" "" | replace " " "" | splitList "," -}}

        {{- range $os := $os_list }}
          {{- range $arch := $arch_list }}

        echo ">> Building FFmpeg for {{$os}}/{{$arch}}..."

        # Create localized workspace build caching structures
        mkdir -p "{{$.TASKFILE_DIR}}/build_cache/cargo_git" \
                 "{{$.TASKFILE_DIR}}/build_cache/ffmpeg_src" \
                 "{{$.TASKFILE_DIR}}/build_cache/ffmpeg_sysroot" \
                 "{{$.TASKFILE_DIR}}/build_cache/meson_cache" \
                 "{{$.TASKFILE_DIR}}/build_cache/apt_cache" \
                 "{{$.TASKFILE_DIR}}/build_cache/apt_lib_cache" \
                 "{{$.TASKFILE_DIR}}/build_cache/llvm-mingw" \
                 "{{$.TASKFILE_DIR}}/build_cache/ccache" \
                 "{{$.TASKFILE_DIR}}/build_cache/compiler-rt" \
                 "{{$.OUT_DIR}}/{{$os}}/{{$arch}}"

        docker run --rm \
          --add-host=host.docker.internal:host-gateway \
          -e MACOSX_DEPLOYMENT_TARGET="{{$.MACOSX_DEPLOYMENT_TARGET}}" \
          -v "{{$.OUT_DIR}}/{{$os}}/{{$arch}}:/output" \
          -v "{{$.TASKFILE_DIR}}/build_cache/ffmpeg_src:/build" \
          -v "{{$.TASKFILE_DIR}}/build_cache/ffmpeg_sysroot:/sysroot" \
          -v "{{$.TASKFILE_DIR}}/build_cache/meson_cache:/root/.cache/meson" \
          -v "{{$.TASKFILE_DIR}}/build_cache/apt_cache:/var/cache/apt" \
          -v "{{$.TASKFILE_DIR}}/build_cache/apt_lib_cache:/var/lib/apt" \
          -v "{{$.TASKFILE_DIR}}/build_cache/llvm-mingw:/var/cache/llvm-mingw" \
          -v "{{$.TASKFILE_DIR}}/build_cache/ccache:/var/cache/ccache" \
          -v "{{$.TASKFILE_DIR}}/build_cache/compiler-rt:/var/cache/compiler-rt" \
          ffmpeg-builder {{$os}} {{$arch}}

          {{- end }}
        {{- end }}

        echo ">> All FFmpeg builds complete."
    env:
      DOCKER_BUILDKIT: 1
      MACOSX_DEPLOYMENT_TARGET: '{{.MACOSX_DEPLOYMENT_TARGET}}'
    vars:
      DEFAULT_OUT_DIR: '{{$.TASKFILE_DIR}}/dist'
      OUT_DIR: '{{.OUT_DIR | default .DEFAULT_OUT_DIR }}'
      MACOSX_DEPLOYMENT_TARGET: '{{.MACOSX_DEPLOYMENT_TARGET | default "10.15"}}'

  # Base shared command
  build_base:
    internal: true
    dir: '{{.TASKFILE_DIR}}' # Force compilation directory to always be here
    cmds:
      - |
        if [ "{{.IS_TEST}}" = "true" ]; then
          echo ">>> Running integration tests for {{.GOOS}}/{{.GOARCH}}..."
          {{if eq OS "windows"}}
          CC="{{.WINDOWS_MINGW_BIN}}/gcc.exe" \
          CXX="{{.WINDOWS_MINGW_BIN}}/g++.exe" \
          PATH="{{.WINDOWS_MINGW_BIN}};$PATH" \
          {{end}}
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I{{.FFMPEG_SRC_DIR}}/include" \
          CGO_LDFLAGS="-L{{.FFMPEG_SRC_DIR}}/lib {{.LDFLAGS_EXTRA}}" \
          GOOS={{.GOOS}} \
          GOARCH={{.GOARCH}} \
          go test -v -race -count=1 ./ -run TestIntegration_
        else
          echo "Building sidecar for {{.GOOS}}/{{.GOARCH}} using FFmpeg libs from {{.FFMPEG_SRC_DIR}}..."
          {{if eq OS "windows"}}
          CC="{{.WINDOWS_MINGW_BIN}}/gcc.exe" \
          CXX="{{.WINDOWS_MINGW_BIN}}/g++.exe" \
          PATH="{{.WINDOWS_MINGW_BIN}};$PATH" \
          {{end}}
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I{{.FFMPEG_SRC_DIR}}/include {{if eq .RELEASE "true"}}-DPRODUCTION{{end}}" \
          CGO_LDFLAGS="-L{{.FFMPEG_SRC_DIR}}/lib {{.LDFLAGS_EXTRA}}" \
          GOOS={{.GOOS}} \
          GOARCH={{.GOARCH}} \
          go build {{if eq .GOOS "windows"}}-ldflags="-H=windowsgui"{{end}} -o '{{.OUTFILE}}' "{{.TASKFILE_DIR}}"

          {{if eq .GOOS "darwin"}}
          echo ">>> Patching compiled binary dyld paths for macOS..."
          install_name_tool -change "libz.1.dylib" "/usr/lib/libz.1.dylib" "{{.OUTFILE}}"
          {{end}}
          echo ">>> Built sidecar to '{{.OUTFILE}}'"
        fi
    vars:
      DEFAULT_OUT_DIR: '{{.TASKFILE_DIR}}/bin'
      # Safely fall back to default output directory if OUT_DIR is empty or unresolved
      OUT_DIR: '{{if .OUT_DIR}}{{.OUT_DIR}}{{else}}{{.DEFAULT_OUT_DIR}}{{end}}'
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      FFMPEG_SRC_BASE: '{{.FFMPEG_LIB_DIR | default (print .TASKFILE_DIR "/../../libs/ffmpeg") | clean}}'
      # Match the dynamic build directory to the target platform, not the host machine
      FFMPEG_SRC_DIR: '{{.FFMPEG_SRC_DIR | default (print .FFMPEG_SRC_BASE "/" .GOOS "/" .GOARCH) | clean}}'
      LDFLAGS_EXTRA: '{{.LDFLAGS_EXTRA}} {{.FFMPEG_SRC_DIR}}/lib/libz.a'

      # Safe filename resolver with defensive extension appending
      DEFAULT_FILE_NAME: 'sidecar_{{.GOOS}}_{{.GOARCH}}'
      RESOLVED_FILE_NAME: '{{.OUT_FILE_NAME | default .DEFAULT_FILE_NAME}}'
      OUTFILE: '{{.OUT_DIR}}/{{.RESOLVED_FILE_NAME}}{{if and (eq .GOOS "windows") (not (hasSuffix ".exe" .RESOLVED_FILE_NAME))}}.exe{{end}}'
      IS_TEST: '{{.IS_TEST | default "false"}}'
      RELEASE: '{{.RELEASE}}'
      WINDOWS_MINGW_BIN:
        sh: |
          if [ "{{OS}}" != "windows" ]; then
            exit 0
          fi
          set -- \
            "${USERPROFILE}/scoop/apps/mingw/current/bin/gcc.exe" \
            "${USERPROFILE}/scoop/apps/gcc/current/bin/gcc.exe" \
            "C:/msys64/mingw64/bin/gcc.exe" \
            "C:/mingw64/bin/gcc.exe" \
            "C:/ProgramData/mingw64/mingw64/bin/gcc.exe"
          for p in "$@"; do
            if [ -f "$p" ]; then
              echo "${p%/*}"
              exit 0
            fi
          done
          echo "MinGW gcc.exe not found (need posix-seh gcc, not LLVM clang)" >&2
          exit 1

  # Native Platform Tasks
  build:native:darwin:
    desc: "Builds FFmpeg sidecar for macOS"
    vars:
      OUT_DIR: '{{.OUT_DIR}}'
      OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
      GOOS: darwin
      GOARCH: '{{.GOARCH | default "arm64"}}'
      FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
      RELEASE: '{{.RELEASE}}'
      # We link swresample, our static dependencies, compression formats, and macOS engine frameworks
      LDFLAGS_EXTRA: >-
        -lavformat -lavcodec -lavutil -lswresample -lswscale
        -lx264 -lx265 -lvpx -laom -ldav1d -lopus -lvorbis -lvorbisenc -logg -lmp3lame -lwebp -lwebpdecoder -lwebpmux -lwebpdemux -lsharpyuv -lass -lharfbuzz -lfreetype -lpng -liconv -lbz2 -llzma -lc++
        -framework CoreFoundation -framework CoreMedia -framework VideoToolbox -framework AudioToolbox -framework CoreAudio -framework CoreGraphics -framework CoreText -framework CoreVideo -framework Security -lresolv
    cmds:
      - task: build_base
        vars:
          GOOS: '{{.GOOS}}'
          GOARCH: '{{.GOARCH}}'
          LDFLAGS_EXTRA: '{{.LDFLAGS_EXTRA}}'
          OUT_DIR: '{{.OUT_DIR}}'
          OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
          FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
          RELEASE: '{{.RELEASE}}'

  build:native:windows:
    desc: "Builds FFmpeg sidecar for Windows"
    vars:
      GOOS: windows
      OUT_DIR: '{{.OUT_DIR}}'
      OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
      FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
      RELEASE: '{{.RELEASE}}'
      # Windows requires Winsock and threading libraries
      # Miniaudio calls winmm/ole32. FFmpeg calls sockets, crypto APIs, and media engine foundations.
      LDFLAGS_EXTRA: >-
        -lavformat -lavcodec -lavutil -lswresample -lswscale
        -lx264 -lx265 -lvpx -laom -ldav1d -lopus -lvorbis -lvorbisenc -logg -lmp3lame
        -lwebp -lwebpdecoder -lwebpmux -lwebpdemux -lsharpyuv
        -lass -lharfbuzz -lfreetype -lpng16 -liconv -lbz2 -llzma
        -lstdc++
        -lws2_32 -lbcrypt -lncrypt -lcrypt32 -lsecur32
        -lmfplat -lmfuuid -lstrmiids -luuid
        -lwinmm -lole32 -luser32 -lgdi32 -lshlwapi
    cmds:
      - task: build_base
        vars:
          GOOS: '{{.GOOS}}'
          GOARCH: '{{.GOARCH}}'
          LDFLAGS_EXTRA: '{{.LDFLAGS_EXTRA}}'
          OUT_DIR: '{{.OUT_DIR}}'
          OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
          FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
          RELEASE: '{{.RELEASE}}'

  build:native:linux:
    desc: "Builds FFmpeg sidecar for Linux"
    vars:
      FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
      OUT_DIR: '{{.OUT_DIR}}'
      OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
      GOOS: linux
      GOARCH: '{{.GOARCH | default "amd64"}}'
      RELEASE: '{{.RELEASE}}'
      # Linux requires standard pthread and math libraries for static linking
      # Miniaudio uses lasound. We add math, standard threading, and dependency libraries.
      LDFLAGS_EXTRA: >-
        -lavformat -lavcodec -lavutil -lswresample -lswscale
        -lx264 -lx265 -lvpx -laom -ldav1d -lopus -lvorbis -lvorbisenc -logg -lmp3lame -lwebp -lwebpdecoder -lwebpmux -lwebpdemux -lass -lharfbuzz -lfreetype -lpng -liconv -lbz2 -llzma
        -lasound -lm -lpthread -ldl
    cmds:
      - task: build_base
        vars:
          GOOS: '{{.GOOS}}'
          GOARCH: '{{.GOARCH}}'
          LDFLAGS_EXTRA: '{{.LDFLAGS_EXTRA}}'
          OUT_DIR: '{{.OUT_DIR}}'
          OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
          FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
          RELEASE: '{{.RELEASE}}'

  # The run task now maps dynamically based on passed arguments
  run:
    desc: "Builds and runs the sidecar for a specific platform (e.g., task run -- OS=linux ARCH=amd64)"
    vars:
      # Defaults to the host system if not provided
      TARGET_OS: '{{.OS | default "darwin"}}'
      TARGET_ARCH: '{{.ARCH | default "arm64"}}'
    deps:
      # This dynamically calls the correct build task
      - task: "build:native:{{.TARGET_OS}}"
        vars: 
          GOOS: '{{.TARGET_OS}}'
          GOARCH: '{{.TARGET_ARCH}}'
    cmds:
      - "{{.TASKFILE_DIR}}/bin/sidecar_{{.TARGET_OS}}_{{.TARGET_ARCH}}"

  # The build entrypoint mapping dynamically based on passed arguments
  build:
    desc: "Builds the sidecar for a specific platform (e.g., task build -- OS=linux ARCH=amd64)"
    vars:
      TARGET_OS: '{{.TARGET_OS | default .GOOS | default "darwin"}}'
      TARGET_ARCH: '{{.TARGET_ARCH | default .GOARCH | default "arm64"}}'
      HOST_OS:
        sh: go env GOHOSTOS
      HOST_ARCH:
        sh: go env GOHOSTARCH
      DEFAULT_OUT_DIR: '{{.TASKFILE_DIR}}/bin'
      # Evaluated via root absolute pathing to enforce strict boundaries
      OUT_DIR: '{{if .OUT_DIR}}{{print .ROOT_DIR "/" .OUT_DIR | clean}}{{else}}{{.DEFAULT_OUT_DIR}}{{end}}'
      DEFAULT_OUT_FILE_NAME: 'sidecar_{{.TARGET_OS}}_{{.TARGET_ARCH}}'
      OUT_FILE_NAME: '{{.OUT_FILE_NAME | default .DEFAULT_OUT_FILE_NAME}}'
      # Dynamically choose the target task name based on whether it matches the host OS/Arch
      TARGET_TASK: '{{if and (eq .TARGET_OS OS) (eq .TARGET_ARCH ARCH)}}build:native:{{.TARGET_OS}}{{else}}build:docker{{end}}'
      DEFAULT_FFMPEG_LIB_DIR: '{{$.TASKFILE_DIR}}/dist'
      FFMPEG_LIB_DIR: '{{if .FFMPEG_LIB_DIR}}{{print .ROOT_DIR "/" .FFMPEG_LIB_DIR | clean}}{{else}}{{.DEFAULT_FFMPEG_LIB_DIR}}{{end}}'
      FFMPEG_LIB_ARCH_DIR: '{{.FFMPEG_LIB_DIR}}/{{.TARGET_OS}}/{{.TARGET_ARCH}}'
      MACOSX_DEPLOYMENT_TARGET: '{{.MACOSX_DEPLOYMENT_TARGET}}'
      RELEASE: '{{.RELEASE | default "false"}}'
    deps:
      - task: generate:proto
    cmds:
      # Natively call the resolved task using Task's internal pipeline
      - task: "{{.TARGET_TASK}}"
        vars:
          GOOS: '{{.TARGET_OS}}'
          GOARCH: '{{.TARGET_ARCH}}'
          TARGET_OS: '{{.TARGET_OS}}'
          TARGET_ARCH: '{{.TARGET_ARCH}}'
          OUT_DIR: '{{.OUT_DIR}}'
          OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
          FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
          RELEASE: '{{.RELEASE}}'
    preconditions:
      # Cross-platform directory & contents check (works on macOS, Linux, and Windows PowerShell/cmd)
      - sh: '{{if eq .HOST_OS "windows"}}powershell -Command "if (!(Test-Path ''{{.FFMPEG_LIB_ARCH_DIR}}/lib'')) { exit 1 }; if ((Get-ChildItem ''{{.FFMPEG_LIB_ARCH_DIR}}/lib'').Count -eq 0) { exit 1 }"{{else}}[ -d "{{.FFMPEG_LIB_ARCH_DIR}}/lib" ] && [ "$(ls -A "{{.FFMPEG_LIB_ARCH_DIR}}/lib" 2>/dev/null)" ]{{end}}'
        msg: "FFmpeg static dependencies are missing or empty at '{{.FFMPEG_LIB_ARCH_DIR}}'. Please run 'task build:ffmpeg' first."

  build:docker:
    desc: "Builds the sidecar via Docker cross-compilation"
    internal: true
    deps:
      - task: apt-cache
      - task: create-ffmpeg-builder
    vars:
      TARGET_OS: '{{.TARGET_OS}}'
      TARGET_ARCH: '{{.TARGET_ARCH}}'
      OUT_DIR: '{{.OUT_DIR}}'
      OUT_FILE_NAME: '{{.OUT_FILE_NAME}}'
      FFMPEG_LIB_DIR: '{{.FFMPEG_LIB_DIR}}'
      MACOSX_DEPLOYMENT_TARGET: '{{.MACOSX_DEPLOYMENT_TARGET}}'
      RELEASE: '{{.RELEASE}}'
    cmds:
      - echo ">> Routing to Docker cross-compiler for {{.TARGET_OS}}/{{.TARGET_ARCH}}..."
      - cmd: mkdir -p "{{.OUT_DIR}}"
        platforms: [linux, darwin]
      - cmd: powershell -Command "New-Item -ItemType Directory -Force -Path '{{.OUT_DIR}}'"
        platforms: [windows]
      - |
        docker run --rm \
          --entrypoint /usr/local/bin/build_sidecar.sh \
          -e SIDECAR_OUT_DIR=/output \
          -e SIDECAR_OUT_FILE={{.OUT_FILE_NAME}} \
          -e MACOSX_DEPLOYMENT_TARGET="{{.MACOSX_DEPLOYMENT_TARGET}}" \
          -e RELEASE="{{.RELEASE}}" \
          -e GOCACHE="/go/build-cache" \
          -e GOMODCACHE="/go/pkg/mod" \
          -v "{{.TASKFILE_DIR}}/build_cache/go_module_cache/{{.TARGET_OS}}/{{.TARGET_ARCH}}:/go/pkg/mod" \
          -v "{{.TASKFILE_DIR}}/build_cache/go_build_cache/{{.TARGET_OS}}/{{.TARGET_ARCH}}:/go/go-build" \
          -v "{{.OUT_DIR}}:/output" \
          -v "{{.TASKFILE_DIR}}:/src" \
          -v "{{.FFMPEG_LIB_DIR}}:/ffmpeg_libs" \
          ffmpeg-builder {{.TARGET_OS}} {{.TARGET_ARCH}} sidecar

  install:proto_plugins:
    desc: "Installs host-native protoc Go plugins into this Taskfile's bin/"
    run: once
    internal: true
    cmds:
      - cmd: powershell.exe -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{joinPath .TASKFILE_DIR "bin"}}' | Out-Null"
        platforms: [windows]
        ignore_error: true
      - cmd: mkdir -p '{{joinPath .TASKFILE_DIR "bin"}}'
        platforms: [linux, darwin]
      - |
        GOBIN="{{joinPath .TASKFILE_DIR "bin"}}" GOOS= GOARCH= \
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - |
        GOBIN="{{joinPath .TASKFILE_DIR "bin"}}" GOOS= GOARCH= \
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    dir: '{{.TASKFILE_DIR}}'
    status:
      - test -f '{{joinPath .TASKFILE_DIR "bin" (print "protoc-gen-go" exeExt)}}'
      - test -f '{{joinPath .TASKFILE_DIR "bin" (print "protoc-gen-go-grpc" exeExt)}}'

  generate:proto:
    desc: "Generates gRPC Go stubs from stream.proto"
    run: once
    deps:
      - task: install:proto_plugins
    vars:
      EXE_EXT: '{{if eq OS "windows"}}.exe{{else}}{{end}}'
      PROTOC_GEN_GO: '{{joinPath .TASKFILE_DIR "bin" (print "protoc-gen-go" .EXE_EXT)}}'
      PROTOC_GEN_GO_GRPC: '{{joinPath .TASKFILE_DIR "bin" (print "protoc-gen-go-grpc" .EXE_EXT)}}'
      PROTO_FILE: '{{joinPath .TASKFILE_DIR "proto" "stream.proto"}}'
      # Windows only: directory that contains protoc.exe
      WINDOWS_PROTOC_DIR:
        sh: |
          if [ "{{OS}}" != "windows" ]; then
            exit 0
          fi
          powershell.exe -NoProfile -Command "& {
            \$ErrorActionPreference = 'SilentlyContinue'
            \$candidates = [System.Collections.Generic.List[string]]::new()
            \$candidates.Add((Join-Path '{{.TASKFILE_DIR}}' 'bin\protoc.exe'))
            \$candidates.Add((Join-Path \$env:LOCALAPPDATA 'Microsoft\WinGet\Links\protoc.exe'))
            Get-ChildItem (Join-Path \$env:LOCALAPPDATA 'Microsoft\WinGet\Packages') -Directory -Filter 'Google.Protobuf*' |
              ForEach-Object { \$candidates.Add((Join-Path \$_.FullName 'bin\protoc.exe')) }
            \$candidates.Add('C:\ProgramData\chocolatey\bin\protoc.exe')
            \$candidates.Add((Join-Path \$env:USERPROFILE 'scoop\shims\protoc.exe'))
            \$candidates.Add((Join-Path \$env:USERPROFILE 'scoop\apps\protobuf\current\bin\protoc.exe'))
            foreach (\$p in \$candidates) {
              if (\$p -and (Test-Path -LiteralPath \$p)) {
                Write-Output (Split-Path -Parent \$p)
                exit 0
              }
            }
            \$cmd = Get-Command protoc.exe
            if (\$cmd -and \$cmd.Source) {
              Write-Output (Split-Path -Parent \$cmd.Source)
              exit 0
            }
            Write-Error 'protoc.exe not found. Install with: winget install Google.Protobuf'
            exit 1
          }"
    env:
      PATH: '{{if and (eq OS "windows") .WINDOWS_PROTOC_DIR}}{{.WINDOWS_PROTOC_DIR}};{{end}}{{env "PATH"}}'
    cmds:
      - cmd: |
          PATH="{{.WINDOWS_PROTOC_DIR}};$PATH" protoc.exe \
            --proto_path="{{.TASKFILE_DIR}}" \
            --plugin=protoc-gen-go="{{.PROTOC_GEN_GO}}" \
            --plugin=protoc-gen-go-grpc="{{.PROTOC_GEN_GO_GRPC}}" \
            --go_out="{{.TASKFILE_DIR}}" --go_opt=paths=source_relative \
            --go-grpc_out="{{.TASKFILE_DIR}}" --go-grpc_opt=paths=source_relative \
            "{{.PROTO_FILE}}"
        platforms: [windows]
      - cmd: |
          protoc \
            --proto_path="{{.TASKFILE_DIR}}" \
            --plugin=protoc-gen-go="{{.PROTOC_GEN_GO}}" \
            --plugin=protoc-gen-go-grpc="{{.PROTOC_GEN_GO_GRPC}}" \
            --go_out="{{.TASKFILE_DIR}}" --go_opt=paths=source_relative \
            --go-grpc_out="{{.TASKFILE_DIR}}" --go-grpc_opt=paths=source_relative \
            "{{.PROTO_FILE}}"
        platforms: [linux, darwin]
      - cmd: go mod tidy
        dir: '{{.TASKFILE_DIR}}'
    sources:
      - '{{.TASKFILE_DIR}}/proto/stream.proto'
    generates:
      - '{{.TASKFILE_DIR}}/proto/stream.pb.go'
      - '{{.TASKFILE_DIR}}/proto/stream_grpc.pb.go'